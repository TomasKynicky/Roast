[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roast-tool"
version = "0.1.0"
description = "Brutal, honest AI code reviewer for the terminal"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "httpx>=0.27",
]

[project.scripts]
roast = "cr.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["cr*"]
